<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shadow Vault</title>
  <style>
    html, body { margin: 0; padding: 0; background: #0a0a12; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    #game { display: block; background: #111; }
    /* Screen-reader announcements only: keep it out of the layout so it
       cannot shift the canvas (a flex item here would push the game off-centre). */
    #status { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
  </style>
</head>
<body>
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="status" role="status" aria-live="polite"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
